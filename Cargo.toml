[package]
name = "arena-b"
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Ultra-fast bump allocation arena with specialized allocation methods for parsers, game engines, and data processing"
readme = "README.md"
repository = "https://github.com/M1tsumi/arena-b"
homepage = "https://quefep.uk"
documentation = "https://docs.rs/arena-b"
keywords = ["allocator", "memory", "arena", "bump", "pool", "performance", "fast", "parser", "gamedev"]
categories = ["memory-management", "data-structures"]

[lib]
name = "arena_b"
path = "src/lib.rs"

[dependencies]

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"

[features]
default = ["stats"]
stats = []

[[bench]]
name = "arena_vs_box"
harness = false

[[bench]]
name = "optimization_benchmarks"
harness = false

[[bench]]
name = "advanced_benchmarks"
harness = false

[[bench]]
name = "v0_4_0_benchmarks"
harness = false
