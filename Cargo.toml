[package]
name = "bumper"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "High-performance bump allocation arena for Rust"
readme = "README.md"
repository = "https://github.com/pawso/Bumper"
homepage = "https://github.com/pawso/Bumper"
documentation = "https://docs.rs/bumper"
keywords = ["allocator", "memory", "arena", "bump", "pool"]
categories = ["memory-management", "data-structures"]

[lib]
name = "bumper"
path = "src/lib.rs"

[dependencies]

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"

[features]
default = ["stats"]
stats = []

[[bench]]
name = "arena_vs_box"
harness = false
