name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Show rustc version and target
        run: |
          rustc -Vv
          rustc --print target-list | grep -E "(x86_64|aarch64)"

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        if: matrix.os != 'macos-latest'

      - name: Cargo clippy (macOS - exclude debug feature)
        run: cargo clippy --all-targets --features "stats virtual_memory thread_local lockfree" -- -D warnings
        if: matrix.os == 'macos-latest'

      - name: Cargo test (all features)
        run: cargo test --all-features
        if: matrix.os != 'macos-latest'

      - name: Cargo test (macOS - exclude debug feature)
        run: cargo test --features "stats virtual_memory thread_local lockfree"
        if: matrix.os == 'macos-latest'

      - name: Cargo test (no default features)
        run: cargo test --no-default-features --tests

      - name: Cargo doc
        run: cargo doc --no-deps --all-features

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Run arena_vs_box benchmark (short)
        env:
          RUSTFLAGS: "-C debuginfo=0"
        run: cargo bench --bench arena_vs_box -- --sample-size 20
